                  const active = workspaceUid === c.id;
                  return (
                    <li key={c.id} className="flex items-center justify-between gap-3 border border-slate-200 rounded-xl p-3.5">
                      <div>
                        <div className="text-sm font-semibold text-slate-900">{c.displayName || c.email || 'Client'}</div>
                        <div className="text-xs text-slate-500">Your role: {myRole || '—'}</div>
                      </div>
                      <button
                        type="button"
                        onClick={() => onSwitchWorkspace(active ? user.uid : c.id)}
                        className={`text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer ${
                          active
                            ? 'bg-slate-900 text-white'
                            : 'border border-slate-200 text-slate-700 hover:bg-slate-50'
                        }`}
                      >
                        {active ? 'Viewing' : 'Open goals'}
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        </div>
      );
    }

    function DailyTaskSection({
      goal,
      isOwner = true,
      canEditSubcategoryTasks = () => true,
      onAddSubcategory,
      onRenameSubcategory,
      onDeleteSubcategory,
      onSetSubcategoryRole,
      onAddTask,
      onToggleTask,
      onDeleteTask,
    }) {
      const [newSubName, setNewSubName] = useState('');
      const [expandedIds, setExpandedIds] = useState({});

      const todayStr = getTodayDateString();
      const todayTasks = (goal.tasks || []).filter((t) => t.date === todayStr);
      const subcategories = useMemo(() => {
        return [...(goal.subcategories || [])].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      }, [goal.subcategories]);

      const uncategorizedTasks = useMemo(
        () => todayTasks.filter((t) => !t.subcategoryId),
        [todayTasks]
      );

      const toggleExpanded = (id) => {
        setExpandedIds((prev) => ({ ...prev, [id]: !prev[id] }));
      };

      const handleAddSub = async (e) => {
        e.preventDefault();
        if (!newSubName.trim()) return;
        const id = await onAddSubcategory(goal.id, newSubName.trim());
        setNewSubName('');
        if (id) {
          setExpandedIds((prev) => ({ ...prev, [id]: true }));
        }
      };

      return (
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Today's Daily Tasks</h2>
              <p className="text-xs text-slate-400">
                Expand a sub-category to reveal its task list
              </p>
            </div>
            <span className="text-xs font-bold px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-full">
              {todayTasks.filter((t) => t.completed).length}/{todayTasks.length} Completed
            </span>
          </div>

          <div className="space-y-1.5">
            {subcategories.length === 0 && uncategorizedTasks.length === 0 && (
              <div className="text-center py-8 border border-dashed border-slate-200 rounded-xl text-slate-400 text-xs sm:text-sm mb-3">
                Add a sub-category below, then expand it to add tasks.
              </div>
            )}

            {uncategorizedTasks.length > 0 && (
              <SubcategoryBlock
                name="Uncategorized"
                expanded={!!expandedIds.__uncategorized__}
                onToggle={() => toggleExpanded('__uncategorized__')}
                tasks={uncategorizedTasks}
                goal={goal}
                canDelete={false}
                canAdd={false}
                canRename={false}
                canEditTasks={isOwner}
                onToggleTask={onToggleTask}
                onDeleteTask={onDeleteTask}
              />
            )}

            {subcategories.map((sub) => {
              const canEdit = canEditSubcategoryTasks(sub);
              return (
              <SubcategoryBlock
                key={sub.id}
                name={sub.name}
                expanded={!!expandedIds[sub.id]}
                onToggle={() => toggleExpanded(sub.id)}
                onRename={(nextName) => onRenameSubcategory(goal.id, sub.id, nextName)}
                onDelete={() => onDeleteSubcategory(goal.id, sub.id)}
                tasks={todayTasks.filter((t) => t.subcategoryId === sub.id)}
                goal={goal}
                subcategoryId={sub.id}
                editorRole={sub.editorRole || ''}
                canDelete={isOwner}
                canAdd={canEdit}
                canRename={isOwner}
                canEditTasks={canEdit}
                onSetRole={
                  isOwner && onSetSubcategoryRole
                    ? (nextRole) => onSetSubcategoryRole(goal.id, sub.id, nextRole)
                    : undefined
                }
                onAddTask={onAddTask}
                onToggleTask={onToggleTask}
                onDeleteTask={onDeleteTask}
              />
              );
            })}
          </div>

          {isOwner && (
          <form onSubmit={handleAddSub} className="mt-4 flex gap-2">
            <input
              type="text"
              placeholder="New sub-category (e.g. Workout, Study)"
              value={newSubName}
              onChange={(e) => setNewSubName(e.target.value)}
              className="flex-1 text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
            />
            <button
              type="submit"
              disabled={!newSubName.trim()}
              className="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 disabled:opacity-40 text-white text-sm font-semibold rounded-xl transition cursor-pointer"
            >
              + Add
            </button>
          </form>
          )}
        </div>
      );
    }

    function SubcategoryBlock({
      name,
      expanded,
      onToggle,
      onRename,
      onDelete,
      tasks,
      goal,
      subcategoryId,
      editorRole = '',
      canDelete,
      canAdd,
      canRename,
      canEditTasks = true,
      onSetRole,
      onAddTask,
      onToggleTask,
      onDeleteTask,
    }) {
      const [text, setText] = useState('');
      const [priority, setPriority] = useState('medium');
      const [editing, setEditing] = useState(false);
      const [editVal, setEditVal] = useState(name);

      const sortedTasks = useMemo(() => {
        return [...tasks].sort((a, b) => Number(a.completed) - Number(b.completed));
      }, [tasks]);

      const done = tasks.filter((t) => t.completed).length;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!text.trim() || !subcategoryId) return;
        onAddTask(goal.id, text.trim(), priority, subcategoryId);
        setText('');
      };

      const handleSaveRename = () => {
        const next = editVal.trim();
        if (next && next !== name && onRename) {
          onRename(next);
        } else {
          setEditVal(name);
        }
        setEditing(false);
      };

      return (
        <div className="rounded-xl border border-slate-200 overflow-hidden">
          <div className="flex items-center gap-1 bg-slate-50/80 hover:bg-slate-50 transition">
            <button
              type="button"
              onClick={onToggle}
              aria-expanded={expanded}
              className="flex-shrink-0 flex items-center justify-center w-10 h-10 text-slate-500 cursor-pointer"
              title={expanded ? 'Collapse' : 'Expand to see tasks'}
            >
              <span className="w-5 h-5 flex items-center justify-center text-[13px] font-bold text-slate-500 border border-slate-300 rounded bg-white">
                {expanded ? '−' : '+'}
              </span>
            </button>
            {editing ? (
              <input
                type="text"
                value={editVal}
                onChange={(e) => setEditVal(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSaveRename();
                  }
                  if (e.key === 'Escape') {
                    setEditVal(name);
                    setEditing(false);
                  }
                }}
                onBlur={handleSaveRename}
                autoFocus
                className="flex-1 min-w-0 text-sm font-semibold text-slate-800 bg-white border border-slate-300 rounded-lg px-2 py-1 mr-1 focus:outline-none focus:ring-1 focus:ring-emerald-600"
              />
            ) : (
              <button
                type="button"
                onClick={onToggle}
                className="flex-1 min-w-0 text-left py-2.5 pr-2 cursor-pointer"
              >
                <span className="block text-sm font-semibold text-slate-800 truncate">{name}</span>
              </button>
            )}
            <span className="text-[11px] text-slate-400 font-medium flex-shrink-0 tabular-nums pr-1">
              {done}/{tasks.length}
            </span>
            {onSetRole ? (
              <select
                value={editorRole || ''}
                onClick={(e) => e.stopPropagation()}
                onChange={(e) => onSetRole(e.target.value)}
                className="text-[10px] text-slate-600 bg-white border border-slate-200 rounded-lg px-1.5 py-1 mr-1 max-w-[7.5rem] cursor-pointer"
                title="Who can edit tasks here"
              >
                <option value="">Client only</option>
                {PROFESSIONAL_ROLES.map((r) => (
                  <option key={r} value={r}>{r}</option>
                ))}
              </select>
            ) : editorRole ? (
              <span className="text-[10px] font-semibold text-slate-500 pr-1">{editorRole}</span>
            ) : null}
            {canRename && !editing && (
              <button
                type="button"
                title="Rename"
                onClick={(e) => {
                  e.stopPropagation();
                  setEditVal(name);
                  setEditing(true);
                }}
                className="text-slate-300 hover:text-slate-600 px-1.5 py-2 text-xs cursor-pointer"
              >
                ✎
              </button>
            )}
            {canDelete && (
              <button
                type="button"
                title="Delete sub-category"
                onClick={(e) => {
                  e.stopPropagation();
                  onDelete();
                }}
                className="text-slate-300 hover:text-rose-500 px-2 py-2 text-xs cursor-pointer"
              >
                ✕
              </button>
            )}
          </div>

          {expanded && (
            <div className="border-t border-slate-200 p-3 space-y-2.5 bg-white">
              {canAdd && (
                <form onSubmit={handleSubmit} className="space-y-2">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Add a task…"
                      value={text}
                      onChange={(e) => setText(e.target.value)}
                      className="flex-1 text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
                    />
                    <button
                      type="submit"
                      disabled={!text.trim()}
                      className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white text-sm font-semibold rounded-xl transition cursor-pointer"
                    >
                      Add
                    </button>
                  </div>
                  <div className="flex items-center gap-1.5 text-xs text-slate-500">
                    <span>Priority:</span>
                    <select
                      value={priority}
                      onChange={(e) => setPriority(e.target.value)}
                      className="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-700 focus:outline-none focus:ring-1 focus:ring-emerald-500 text-xs"
                    >
                      <option value="high">High Priority</option>
                      <option value="medium">Medium Priority</option>
                      <option value="low">Low Priority</option>
                    </select>
                  </div>
                </form>
              )}

              {sortedTasks.length === 0 ? (
                <div className="text-center py-5 text-slate-400 text-xs">
                  {canAdd ? 'No tasks yet. Add one above.' : 'No tasks in this group.'}
                </div>
              ) : (
                sortedTasks.map((t) => (
                  <div
                    key={t.id}
                    className={`flex items-start justify-between p-3 rounded-xl border transition ${
                      t.completed
                        ? 'bg-slate-50/80 border-slate-100 text-slate-400'
                        : 'bg-white border-slate-200 text-slate-800 shadow-xs'
                    }`}
                  >
                    <label className={`flex items-start gap-3 flex-1 min-w-0 pr-3 ${canEditTasks ? 'cursor-pointer' : 'cursor-default'}`}>
                      <input
                        type="checkbox"
                        checked={t.completed}
                        disabled={!canEditTasks}
                        onChange={() => onToggleTask(goal.id, t.id)}
                        className="w-4 h-4 mt-0.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 disabled:opacity-40"
                      />
                      <div className="flex flex-col min-w-0">
                        <span
                          className={`text-sm ${
                            t.completed ? 'line-through text-slate-400' : 'font-medium'
                          }`}
                        >
                          {t.text}
                        </span>
                        <div className="flex items-center gap-2 mt-1">
                          <PriorityBadge priority={t.priority} />
                        </div>
                      </div>
                    </label>
                    {canEditTasks && (
                    <button
                      onClick={() => onDeleteTask(goal.id, t.id)}
                      className="text-slate-300 hover:text-rose-500 p-1 text-xs transition cursor-pointer"
                      title="Delete task"
                    >
                      ✕
                    </button>
                    )}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    function MonthlyMilestoneSection({ goal, readOnly = false, onToggleMilestone, onUpdateMilestoneTitle }) {
      const [editingId, setEditingId] = useState(null);
      const [editVal, setEditVal] = useState('');
      const currentMonthKey = getCurrentMonthKey();

      const milestones = goal.milestones || [];
      const total = milestones.length;
      const completed = milestones.filter((m) => m.completed).length;
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

      const handleStartEdit = (m) => {
        setEditingId(m.id);
        setEditVal(m.title);
      };

      const handleSaveEdit = (mId) => {
        if (editVal.trim()) {
          onUpdateMilestoneTitle(goal.id, mId, editVal.trim());
        }
        setEditingId(null);
      };

      return (
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Monthly Milestones Roadmap</h2>
              <p className="text-xs text-slate-400">Sequential horizons toward {formatFullMonth(goal.targetDate)}</p>
            </div>
            <div className="w-full sm:w-36">
              <div className="flex justify-between text-xs text-slate-500 font-medium mb-1">
                <span>Completed</span>
                <span className="text-slate-900 font-bold">{pct}%</span>
              </div>
              <ProgressBar value={pct} height="h-2" />
            </div>
          </div>

          <div className="relative pl-6 space-y-4 before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-200">
            {milestones.map((m) => {
              const isThisMonth = m.monthKey === currentMonthKey;
              return (
                <div key={m.id} className="relative group">
                  <div
                    className={`absolute -left-6 top-2 w-5 h-5 rounded-full border-2 bg-white flex items-center justify-center transition ${
                      m.completed
                        ? 'border-emerald-600 bg-emerald-600 text-white'
                        : isThisMonth
                        ? 'border-emerald-600 ring-4 ring-emerald-100'
                        : 'border-slate-300'
                    }`}
                  >
                    {m.completed && <span className="text-[10px] font-bold">✓</span>}
                  </div>

                  <div
                    className={`p-4 rounded-xl border transition ${
                      isThisMonth
                        ? 'border-emerald-300 bg-emerald-50/25 shadow-xs'
                        : m.completed
                        ? 'border-slate-100 bg-slate-50/60'
                        : 'border-slate-200 bg-white'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                          {formatFullMonth(m.monthKey)}
                        </span>
                        {isThisMonth && (
                          <span className="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full">
                            CURRENT MONTH
                          </span>
                        )}
                      </div>
                      {!readOnly && (
                      <label className="flex items-center gap-1.5 text-xs text-slate-500 cursor-pointer select-none">
                        <input
                          type="checkbox"
                          checked={m.completed}
                          onChange={() => onToggleMilestone(goal.id, m.id)}
                          className="w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"
                        />
                        <span>{m.completed ? 'Achieved' : 'Mark Done'}</span>
                      </label>
                      )}
                      {readOnly && (
                        <span className="text-[10px] font-semibold text-slate-400">
                          {m.completed ? 'Achieved' : 'Open'}
                        </span>
                      )}
                    </div>

                    {editingId === m.id ? (
                      <div className="flex gap-2 mt-2">
                        <input
                          type="text"
                          value={editVal}
                          onChange={(e) => setEditVal(e.target.value)}
                          className="flex-1 text-sm border border-slate-300 rounded-lg px-2.5 py-1 focus:outline-none focus:ring-1 focus:ring-emerald-600"
                          autoFocus
                        />
                        <button
                          onClick={() => handleSaveEdit(m.id)}
                          className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-semibold cursor-pointer"
                        >
                          Save
                        </button>
                      </div>
                    ) : (
                      <div
                        onClick={() => { if (!readOnly) handleStartEdit(m); }}
                        title={readOnly ? undefined : 'Click to rename this milestone'}
                        className={`text-sm font-medium transition flex items-center justify-between ${
                          readOnly ? '' : 'cursor-pointer hover:text-emerald-700'
                        } ${
                          m.completed ? 'line-through text-slate-400' : 'text-slate-800'
                        }`}
                      >
                        <span>
                          {m.title || <span className="italic text-slate-300">Name this milestone...</span>}
                        </span>
                        {!readOnly && (
                        <span className="text-xs text-slate-300 hover:text-slate-600">✎</span>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function CreateGoalModal({ isOpen, onClose, onSave }) {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('Career & Business');
      const [description, setDescription] = useState('');
      const [targetDate, setTargetDate] = useState('');
      const [saving, setSaving] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!title.trim() || !targetDate || saving) return;

        setSaving(true);
        try {
          await onSave({
            title: title.trim(),
            category,
            description: description.trim(),
            targetDate,
          });

          setTitle('');
          setDescription('');
          setTargetDate('');
          onClose();
        } finally {
          setSaving(false);
        }
      };

      const minMonth = getCurrentMonthKey();

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div className="flex justify-between items-center mb-5">
              <h3 className="text-lg font-bold text-slate-900">Define New Goal Path</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg cursor-pointer">
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                  Goal Title
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Launch New Mobile App"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                    Category
                  </label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-slate-800 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
                  >
                    <option value="Career & Business">Career & Business</option>
                    <option value="Health & Fitness">Health & Fitness</option>
                    <option value="Creative Writing">Creative Writing</option>
                    <option value="Finance & Wealth">Finance & Wealth</option>
                    <option value="Learning & Skills">Learning & Skills</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                    Target Month
                  </label>
                  <input
                    type="month"
                    required
                    min={minMonth}
                    value={targetDate}
                    onChange={(e) => setTargetDate(e.target.value)}
                    className="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-slate-800 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                  Description / Definition of Done
                </label>
                <textarea
                  rows={3}
                  placeholder="What does success look like once completed?"
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 resize-none"
                />
              </div>

              <div className="flex gap-2 justify-end pt-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 font-medium text-sm rounded-xl transition cursor-pointer"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-semibold text-sm rounded-xl transition cursor-pointer"
                >
                  {saving ? 'Creating...' : 'Generate Roadmap'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function PreviewApp() {
      const today = getTodayDateString();
      const [goal, setGoal] = useState({
        id: 'preview-goal',
        title: 'Build healthier routines',
        category: 'Health & Fitness',
        targetDate: getCurrentMonthKey(),
        milestones: [],
        subcategories: [
          { id: 'sc-1', name: 'Workout', order: 0 },
          { id: 'sc-2', name: 'Study', order: 1 },
        ],
        tasks: [
          {
            id: 't-1',
            subcategoryId: 'sc-1',
            text: 'Gym — 45 min',
            completed: false,
            date: today,
            priority: 'high',
          },
          {
            id: 't-2',
            subcategoryId: 'sc-2',
            text: 'Spanish lesson',
            completed: true,
            date: today,
            priority: 'medium',
          },
        ],
      });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 p-6">
          <div className="max-w-xl mx-auto space-y-4">
            <div className="text-xs font-medium text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">
              Preview only — not saved to Firestore. Open without ?preview=1 to use the real app.
            </div>
            <h1 className="text-2xl font-bold">{goal.title}</h1>
            <DailyTaskSection
              goal={goal}
              onAddSubcategory={async (_id, name) => {
                const newId = `sc-${Date.now()}`;
                setGoal((g) => ({
                  ...g,
                  subcategories: [
                    ...(g.subcategories || []),
                    { id: newId, name, order: (g.subcategories || []).length },
                  ],
                }));
                return newId;
              }}
              onRenameSubcategory={async (_id, subcategoryId, name) => {
                setGoal((g) => ({
                  ...g,
                  subcategories: g.subcategories.map((s) =>
                    s.id === subcategoryId ? { ...s, name } : s
                  ),
                }));
              }}
              onDeleteSubcategory={async (_id, subcategoryId) => {
                if (!confirm('Delete this sub-category and all of its tasks?')) return;
                setGoal((g) => ({
                  ...g,
                  subcategories: g.subcategories.filter((s) => s.id !== subcategoryId),
                  tasks: g.tasks.filter((t) => t.subcategoryId !== subcategoryId),
                }));
              }}
              onAddTask={async (_id, text, priority, subcategoryId) => {
                setGoal((g) => ({
                  ...g,
                  tasks: [
                    {
                      id: `t-${Date.now()}`,
                      text,
                      priority: priority || 'medium',
                      completed: false,
                      date: today,
                      subcategoryId: subcategoryId || '',
                    },
                    ...g.tasks,
                  ],
                }));
              }}
              onToggleTask={async (_id, taskId) => {
                setGoal((g) => ({
                  ...g,
                  tasks: g.tasks.map((t) =>
                    t.id === taskId ? { ...t, completed: !t.completed } : t
                  ),
                }));
              }}
              onDeleteTask={async (_id, taskId) => {
                setGoal((g) => ({
                  ...g,
                  tasks: g.tasks.filter((t) => t.id !== taskId),
                }));
              }}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    const isPreview = new URLSearchParams(window.location.search).has('preview');
    root.render(isPreview ? <PreviewApp /> : <App />);
  </script>
</body>
</html>
