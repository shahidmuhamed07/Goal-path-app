<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goal Path — Break Down Goals</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-emerald-100 selection:text-emerald-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      signOut,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore,
      collection,
      query,
      where,
      onSnapshot,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      getDoc,
      setDoc,
      runTransaction
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 1. FIREBASE CONFIG & INITIALIZATION
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyC7DyTPRJHQ_QYT3_CpHOC1IiaCz4Rx8CI",
      authDomain: "goal-path-app.firebaseapp.com",
      projectId: "goal-path-app",
      storageBucket: "goal-path-app.firebasestorage.app",
      messagingSenderId: "803745892418",
      appId: "1:803745892418:web:8ed89bef4ad466e8ee45db",
      measurementId: "G-3C4TZ08341"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // ==========================================
    // 2. UTILS & HELPERS
    // ==========================================
    const getTodayDateString = () => new Date().toISOString().split('T')[0];

    const getCurrentMonthKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };

    const formatMonthKey = (monthKey) => {
      if (!monthKey) return '';
      const [year, month] = monthKey.split('-');
      const date = new Date(parseInt(year, 10), parseInt(month, 10) - 1, 1);
      return date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    };

    const formatFullMonth = (monthKey) => {
      if (!monthKey) return '';
      const [year, month] = monthKey.split('-');
      const date = new Date(parseInt(year, 10), parseInt(month, 10) - 1, 1);
      return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    };

    const generateMonthRange = (startKey, targetKey) => {
      const months = [];
      const [startYear, startMonth] = startKey.split('-').map(Number);
      const [endYear, endMonth] = targetKey.split('-').map(Number);

      let y = startYear;
      let m = startMonth;

      while (y < endYear || (y === endYear && m <= endMonth)) {
        months.push(`${y}-${String(m).padStart(2, '0')}`);
        m++;
        if (m > 12) {
          m = 1;
          y++;
        }
      }
      return months;
    };

    const PROFESSIONAL_ROLES = ['Trainer', 'Dietitian', 'Doctor'];
    const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    const generateInviteCode = () => {
      let code = '';
      for (let i = 0; i < 6; i += 1) {
        code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
      }
      return code;
    };

    const requestDocId = (fromUid, toUid) => `${fromUid}_${toUid}`;

    async function ensureUserProfile(firebaseUser) {
      const userRef = doc(db, 'users', firebaseUser.uid);
      const existing = await getDoc(userRef);
      if (existing.exists() && existing.data().code) {
        await updateDoc(userRef, {
          displayName: firebaseUser.displayName || existing.data().displayName || '',
          email: firebaseUser.email || existing.data().email || '',
          photoURL: firebaseUser.photoURL || existing.data().photoURL || '',
        });
        return;
      }

      for (let i = 0; i < 10; i += 1) {
        const code = generateInviteCode();
        const codeRef = doc(db, 'codes', code);
        try {
          await runTransaction(db, async (transaction) => {
            const codeSnap = await transaction.get(codeRef);
            const userSnap = await transaction.get(userRef);
            if (userSnap.exists() && userSnap.data().code) return;
            if (codeSnap.exists()) throw new Error('CODE_TAKEN');
            transaction.set(codeRef, { uid: firebaseUser.uid });
            transaction.set(
              userRef,
              {
                displayName: firebaseUser.displayName || '',
                email: firebaseUser.email || '',
                photoURL: firebaseUser.photoURL || '',
                code,
                collaborators: userSnap.exists() ? userSnap.data().collaborators || [] : [],
                collaboratorUids: userSnap.exists() ? userSnap.data().collaboratorUids || [] : [],
                createdAt: new Date().toISOString(),
              },
              { merge: true }
            );
          });
          return;
        } catch (err) {
          if (String(err.message || err).includes('CODE_TAKEN')) continue;
          throw err;
        }
      }
      throw new Error('Could not generate a unique access code.');
    }

    // ==========================================
    // 3. UI COMPONENTS & HELPERS
    // ==========================================
    const PriorityBadge = ({ priority }) => {
      const colors = {
        high: 'bg-rose-50 text-rose-700 border-rose-200',
        medium: 'bg-amber-50 text-amber-700 border-amber-200',
        low: 'bg-slate-100 text-slate-600 border-slate-200',
      };
      return (
        <span className={`text-[10px] uppercase font-semibold px-2 py-0.5 rounded-md border ${colors[priority || 'medium']}`}>
          {priority || 'medium'}
        </span>
      );
    };

    const ProgressBar = ({ value = 0, height = 'h-2' }) => (
      <div className={`w-full bg-slate-100 rounded-full overflow-hidden ${height}`}>
        <div
          className="bg-emerald-600 h-full rounded-full transition-all duration-300 ease-out"
          style={{ width: `${Math.min(100, Math.max(0, value))}%` }}
        />
      </div>
    );

    // ==========================================
    // 4. LOGIN SCREEN COMPONENT
    // ==========================================
    const LoginScreen = ({ onLogin, loading, error }) => {
      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
          <div className="max-w-md w-full bg-white border border-slate-200/90 rounded-3xl p-8 shadow-sm text-center animate-in">
            {/* Logo */}
            <div className="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-sm">
              ◎
            </div>

            <h1 className="text-2xl font-bold text-slate-900">Welcome to Goal Path</h1>
            <p className="text-slate-500 text-sm mt-1 mb-8 leading-relaxed">
              Break multi-month goals down into sequential monthly horizons and daily momentum.
            </p>

            {error && (
              <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs px-3.5 py-2.5 rounded-xl mb-6 text-left">
                {error}
              </div>
            )}

            <button
              onClick={onLogin}
              disabled={loading}
              className="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm border border-slate-300 rounded-2xl px-5 py-3.5 shadow-xs hover:border-slate-400 transition-all cursor-pointer disabled:opacity-60"
            >
              <svg className="w-5 h-5" viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                />
              </svg>
              <span>{loading ? 'Connecting...' : 'Sign in with Google'}</span>
            </button>

            <div className="mt-8 pt-6 border-t border-slate-100 flex items-center justify-center gap-4 text-xs text-slate-400">
              <span>Cloud Sync</span>
              <span>•</span>
              <span>Firestore Secured</span>
              <span>•</span>
              <span>Cross-Device</span>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Auth State
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState(null);

      // Data State
      const [goals, setGoals] = useState([]);
      const [dataLoading, setDataLoading] = useState(true);
      const [errorMessage, setErrorMessage] = useState(null);

      // UI View State
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'today' | 'detail'
      const [selectedGoalId, setSelectedGoalId] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      // Collaborator / workspace state
      const [profile, setProfile] = useState(null);
      const [incomingRequests, setIncomingRequests] = useState([]);
      const [outgoingRequests, setOutgoingRequests] = useState([]);
      const [clientList, setClientList] = useState([]);
      const [clientsReady, setClientsReady] = useState(false);
      const [workspaceUid, setWorkspaceUid] = useState(null);
      const [connectNotice, setConnectNotice] = useState(null);
      const [incomingError, setIncomingError] = useState(null);

      // Listen for Firebase Auth State Changes
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(
          auth,
          (currentUser) => {
            setUser(currentUser);
            setAuthLoading(false);
          },
          (err) => {
            console.error('Auth state error:', err);
            setAuthError(err.message);
            setAuthLoading(false);
          }
        );
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) {
          setWorkspaceUid(null);
          setProfile(null);
          return;
        }
        setWorkspaceUid((prev) => prev || user.uid);
        ensureUserProfile(user).catch((err) => {
          console.error('ensureUserProfile:', err);
          setErrorMessage(
            err.message || 'Could not set up your access code. Check Firestore rules for users/codes.'
          );
        });
      }, [user]);

      useEffect(() => {
        if (!user) {
          setProfile(null);
          return undefined;
        }
        const unsub = onSnapshot(
          doc(db, 'users', user.uid),
          (snap) => {
            if (snap.exists()) setProfile({ id: snap.id, ...snap.data() });
          },
          (err) => {
            console.error('Profile listener:', err);
            setErrorMessage('Unable to load your profile. Allow read/write on the users collection.');
          }
        );
        return () => unsub();
      }, [user]);

      useEffect(() => {
        if (!user) {
          setIncomingRequests([]);
          setOutgoingRequests([]);
          setIncomingError(null);
          return undefined;
        }
        const incomingQ = query(collection(db, 'accessRequests'), where('toUid', '==', user.uid));
        const outgoingQ = query(collection(db, 'accessRequests'), where('fromUid', '==', user.uid));
        console.log('[accessRequests] attaching incoming listener', {
          collection: 'accessRequests',
          where: { field: 'toUid', op: '==', value: user.uid },
        });
        const unsubIn = onSnapshot(
          incomingQ,
          (snap) => {
            const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            console.log('[accessRequests incoming raw]', {
              queriedToUid: user.uid,
              empty: snap.empty,
              size: snap.size,
              fromCache: snap.metadata.fromCache,
              hasPendingWrites: snap.metadata.hasPendingWrites,
              docs: rows.map((r) => ({
                id: r.id,
                toUid: r.toUid,
                fromUid: r.fromUid,
                status: r.status,
                role: r.role,
                toUidMatchesUser: r.toUid === user.uid,
                statusIsPending: r.status === 'pending',
                fieldNames: Object.keys(r),
                raw: r,
              })),
            });
            setIncomingError(null);
            setIncomingRequests(rows);
          },
          (err) => {
            console.error('[accessRequests incoming ERROR]', err.code, err.message, err);
            setIncomingError(err.message || String(err));
          }
        );
        const unsubOut = onSnapshot(
          outgoingQ,
          (snap) => {
            const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            console.log('[accessRequests outgoing raw]', {
              queriedFromUid: user.uid,
              size: snap.size,
              docs: rows,
            });
            setOutgoingRequests(rows);
          },
          (err) => console.error('[accessRequests outgoing ERROR]', err.code, err.message, err)
        );
        return () => {
          unsubIn();
          unsubOut();
        };
      }, [user]);

      useEffect(() => {
        if (!user) {
          setClientList([]);
          setClientsReady(false);
          return undefined;
        }
        const clientsQ = query(
          collection(db, 'users'),
          where('collaboratorUids', 'array-contains', user.uid)
        );
        const unsub = onSnapshot(
          clientsQ,
          (snap) => {
            setClientList(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
            setClientsReady(true);
          },
          (err) => {
            console.error('Client list:', err);
            setClientsReady(true);
          }
        );
        return () => unsub();
      }, [user]);

      useEffect(() => {
        if (!user || !workspaceUid || workspaceUid === user.uid) return;
        if (!clientsReady) return;
        if (!clientList.some((c) => c.id === workspaceUid)) {
          setWorkspaceUid(user.uid);
          setActiveTab('dashboard');
          setSelectedGoalId(null);
        }
      }, [user, workspaceUid, clientList, clientsReady]);

      // Realtime Firestore: goals for the active workspace (you, or an approved client)
      useEffect(() => {
        if (!user || !workspaceUid) {
          setGoals([]);
          setDataLoading(false);
          return;
        }

        setDataLoading(true);
        setErrorMessage(null);

        const goalsRef = collection(db, 'goals');
        const q = query(goalsRef, where('userId', '==', workspaceUid));

        const unsubscribe = onSnapshot(
          q,
          (snapshot) => {
            const fetchedGoals = [];
            snapshot.forEach((docSnap) => {
              fetchedGoals.push({
                id: docSnap.id,
                ...docSnap.data(),
                milestones: docSnap.data().milestones || [],
                subcategories: docSnap.data().subcategories || [],
                tasks: docSnap.data().tasks || [],
              });
            });

            // Sort newest first
            fetchedGoals.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

            setGoals(fetchedGoals);
            setDataLoading(false);
          },
          (error) => {
            console.error('Firestore onSnapshot error:', error);
            setErrorMessage('Unable to load goals from cloud storage. Please check connection.');
            setDataLoading(false);
          }
        );

        return () => unsubscribe();
      }, [user, workspaceUid]);

      const isOwner = !!user && workspaceUid === user.uid;
      const workspaceProfile = isOwner
        ? profile
        : clientList.find((c) => c.id === workspaceUid) || null;
      const professionalRole = isOwner
        ? null
        : (workspaceProfile?.collaborators || []).find((c) => c.uid === user?.uid)?.role || null;
      const pendingIncoming = incomingRequests.filter((r) => r.status === 'pending');

      const canEditSubcategoryTasks = (sub) => {
        if (isOwner) return true;
        return !!(sub && sub.editorRole && professionalRole && sub.editorRole === professionalRole);
      };

      const canEditTaskRecord = (goalId, task) => {
        if (isOwner) return true;
        const goal = goals.find((g) => g.id === goalId);
        const sub = (goal?.subcategories || []).find((s) => s.id === task.subcategoryId);
        return canEditSubcategoryTasks(sub);
      };

      // Computed Current Goal
      const currentGoal = useMemo(() => {
        return goals.find((g) => g.id === selectedGoalId) || null;
      }, [goals, selectedGoalId]);

      // Global Stats
      const todayDate = getTodayDateString();
      const allTodayTasks = useMemo(() => {
        return goals.flatMap((g) =>
          g.tasks
            .filter((t) => t.date === todayDate)
            .map((t) => ({
              ...t,
              goalTitle: g.title,
              goalId: g.id,
              subcategoryName:
                (g.subcategories || []).find((s) => s.id === t.subcategoryId)?.name || '',
              editorRole:
                (g.subcategories || []).find((s) => s.id === t.subcategoryId)?.editorRole || null,
            }))
        );
      }, [goals, todayDate]);

      const totalMilestonesCount = useMemo(() => {
        return goals.reduce((acc, g) => acc + (g.milestones ? g.milestones.length : 0), 0);
      }, [goals]);

      const completedMilestonesCount = useMemo(() => {
        return goals.reduce(
          (acc, g) => acc + (g.milestones ? g.milestones.filter((m) => m.completed).length : 0),
          0
        );
      }, [goals]);

      const overallProgress =
        totalMilestonesCount > 0
          ? Math.round((completedMilestonesCount / totalMilestonesCount) * 100)
          : 0;

      // Filtered Goals
      const filteredGoals = useMemo(() => {
        return goals.filter((g) => {
          const matchQuery =
            g.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (g.description && g.description.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchCat = selectedCategory === 'all' || g.category === selectedCategory;
          return matchQuery && matchCat;
        });
      }, [goals, searchQuery, selectedCategory]);

      const categories = useMemo(() => {
        const set = new Set(goals.map((g) => g.category).filter(Boolean));
        return ['all', ...Array.from(set)];
      }, [goals]);

      // ==========================================
      // AUTH ACTIONS
      // ==========================================
      const handleGoogleSignIn = async () => {
        setAuthError(null);
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          console.error('Google Sign In Error:', err);
          setAuthError(err.message || 'Failed to sign in with Google. Please try again.');
        }
      };

      const handleSignOut = async () => {
        try {
          await signOut(auth);
          setSelectedGoalId(null);
          setActiveTab('dashboard');
          setWorkspaceUid(null);
        } catch (err) {
          console.error('Sign Out Error:', err);
          setErrorMessage('Failed to sign out.');
        }
      };

      // ==========================================
      // FIRESTORE GOAL ACTIONS
      // ==========================================
      const handleCreateGoal = async (newGoalData) => {
        if (!user || !isOwner) return;
        try {
          const startKey = getCurrentMonthKey();
          const months = generateMonthRange(startKey, newGoalData.targetDate);

          const milestones = months.map((mKey, idx) => ({
            id: `m-${Date.now()}-${idx}`,
            monthKey: mKey,
            title:
              idx === months.length - 1
                ? `Final: Complete ${newGoalData.title}`
                : `Checkpoint for ${formatMonthKey(mKey)}`,
            completed: false,
          }));

          const docData = {
            userId: user.uid,
            title: newGoalData.title,
            category: newGoalData.category || 'General',
            description: newGoalData.description || '',
            createdAt: todayDate,
            targetDate: newGoalData.targetDate,
            milestones,
            subcategories: [],
            tasks: [],
          };

          const docRef = await addDoc(collection(db, 'goals'), docData);
          setSelectedGoalId(docRef.id);
          setActiveTab('detail');
        } catch (err) {
          console.error('Create Goal error:', err);
          setErrorMessage('Could not save goal to Firestore. Check permissions.');
        }
      };

      const handleDeleteGoal = async (goalId) => {
        if (!isOwner) return;
        if (!confirm('Are you sure you want to delete this goal?')) return;
        try {
          await deleteDoc(doc(db, 'goals', goalId));
          if (selectedGoalId === goalId) {
            setSelectedGoalId(null);
            setActiveTab('dashboard');
          }
        } catch (err) {
          console.error('Delete Goal error:', err);
          setErrorMessage('Failed to delete goal.');
        }
      };

      const handleToggleMilestone = async (goalId, milestoneId) => {
        if (!isOwner) return;
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;

        const updatedMilestones = targetGoal.milestones.map((m) =>
          m.id === milestoneId ? { ...m, completed: !m.completed } : m
        );

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            milestones: updatedMilestones,
          });
        } catch (err) {
          console.error('Update milestone error:', err);
          setErrorMessage('Failed to update milestone status.');
        }
      };

      const handleUpdateMilestoneTitle = async (goalId, milestoneId, title) => {
        if (!isOwner) return;
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;

        const updatedMilestones = targetGoal.milestones.map((m) =>
          m.id === milestoneId ? { ...m, title } : m
        );

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            milestones: updatedMilestones,
          });
        } catch (err) {
          console.error('Update milestone title error:', err);
          setErrorMessage('Failed to rename milestone.');
        }
      };

      const handleAddSubcategory = async (goalId, name) => {
        if (!isOwner) return null;
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return null;

        const newSub = {
          id: `sc-${Date.now()}`,
          name,
          order: (targetGoal.subcategories || []).length,
          editorRole: null,
        };

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            subcategories: [...(targetGoal.subcategories || []), newSub],
          });
          return newSub.id;
        } catch (err) {
          console.error('Add subcategory error:', err);
          setErrorMessage('Failed to add sub-category.');
          return null;
        }
      };

      const handleRenameSubcategory = async (goalId, subcategoryId, name) => {
        if (!isOwner) return;
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;

        const updatedSubcategories = (targetGoal.subcategories || []).map((s) =>
          s.id === subcategoryId ? { ...s, name } : s
        );

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            subcategories: updatedSubcategories,
          });
        } catch (err) {
          console.error('Rename subcategory error:', err);
          setErrorMessage('Failed to rename sub-category.');
        }
      };

      const handleDeleteSubcategory = async (goalId, subcategoryId) => {
        if (!isOwner) return;
        if (!confirm('Delete this sub-category and all of its tasks?')) return;

        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;

        const updatedSubcategories = (targetGoal.subcategories || []).filter(
          (s) => s.id !== subcategoryId
        );
        const updatedTasks = (targetGoal.tasks || []).filter((t) => t.subcategoryId !== subcategoryId);

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            subcategories: updatedSubcategories,
            tasks: updatedTasks,
          });
        } catch (err) {
          console.error('Delete subcategory error:', err);
          setErrorMessage('Failed to delete sub-category.');
        }
      };

      const handleSetSubcategoryRole = async (goalId, subcategoryId, editorRole) => {
        if (!isOwner) return;
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;

        const updatedSubcategories = (targetGoal.subcategories || []).map((s) =>
          s.id === subcategoryId ? { ...s, editorRole: editorRole || null } : s
        );

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            subcategories: updatedSubcategories,
          });
        } catch (err) {
          console.error('Set subcategory role error:', err);
          setErrorMessage('Failed to update sub-category access.');
        }
      };

      const handleAddTask = async (goalId, text, priority, subcategoryId) => {
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;

        if (!isOwner) {
          const sub = (targetGoal.subcategories || []).find((s) => s.id === subcategoryId);
          if (!canEditSubcategoryTasks(sub)) {
            setErrorMessage('You can only add tasks in sub-categories tagged with your role.');
            return;
          }
        }

        const newTask = {
          id: `t-${Date.now()}`,
          text,
          priority: priority || 'medium',
          completed: false,
          date: todayDate,
          subcategoryId: subcategoryId || '',
        };

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            tasks: [newTask, ...targetGoal.tasks],
          });
        } catch (err) {
          console.error('Add task error:', err);
          setErrorMessage('Failed to add task.');
        }
      };

      const handleToggleTask = async (goalId, taskId) => {
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;
        const task = (targetGoal.tasks || []).find((t) => t.id === taskId);
        if (!task || !canEditTaskRecord(goalId, task)) {
          setErrorMessage('You do not have permission to edit this task.');
          return;
        }

        const updatedTasks = targetGoal.tasks.map((t) =>
          t.id === taskId ? { ...t, completed: !t.completed } : t
        );

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            tasks: updatedTasks,
          });
        } catch (err) {
          console.error('Toggle task error:', err);
          setErrorMessage('Failed to update task.');
        }
      };

      const handleDeleteTask = async (goalId, taskId) => {
        const targetGoal = goals.find((g) => g.id === goalId);
        if (!targetGoal) return;
        const task = (targetGoal.tasks || []).find((t) => t.id === taskId);
        if (!task || !canEditTaskRecord(goalId, task)) {
          setErrorMessage('You do not have permission to delete this task.');
          return;
        }

        const updatedTasks = targetGoal.tasks.filter((t) => t.id !== taskId);

        try {
          await updateDoc(doc(db, 'goals', goalId), {
            tasks: updatedTasks,
          });
        } catch (err) {
          console.error('Delete task error:', err);
          setErrorMessage('Failed to delete task.');
        }
      };

      const handleRequestAccess = async (rawCode, role) => {
        setConnectNotice(null);
        const code = (rawCode || '').trim().toUpperCase();
        if (!code || code.length !== 6) {
          setConnectNotice({ type: 'error', text: 'Enter a 6-character access code.' });
          return;
        }
        if (!PROFESSIONAL_ROLES.includes(role)) {
          setConnectNotice({ type: 'error', text: 'Choose a professional role.' });
          return;
        }
        if (profile?.code && code === profile.code) {
          setConnectNotice({ type: 'error', text: 'That is your own code. Share it with a client instead.' });
          return;
        }

        try {
          const codeSnap = await getDoc(doc(db, 'codes', code));
          if (!codeSnap.exists()) {
            setConnectNotice({ type: 'error', text: 'No account found for that code.' });
            return;
          }
          const toUid = codeSnap.data().uid;
          if (toUid === user.uid) {
            setConnectNotice({ type: 'error', text: 'You cannot connect to your own account.' });
            return;
          }

          const reqRef = doc(db, 'accessRequests', requestDocId(user.uid, toUid));
          const existing = await getDoc(reqRef);
          if (existing.exists()) {
            const status = existing.data().status;
            if (status === 'pending') {
              setConnectNotice({ type: 'error', text: 'A request is already waiting for this client.' });
              return;
            }
            if (status === 'approved') {
              setConnectNotice({ type: 'error', text: 'You already have access to this client.' });
              return;
            }
          }

          await setDoc(reqRef, {
            fromUid: user.uid,
            fromName: user.displayName || user.email || 'Professional',
            fromEmail: user.email || '',
            fromPhoto: user.photoURL || '',
            toUid,
            toCode: code,
            role,
            status: 'pending',
            createdAt: new Date().toISOString(),
          });
          setConnectNotice({ type: 'ok', text: 'Request sent. The client must approve it.' });
        } catch (err) {
          console.error('Request access error:', err);
          setConnectNotice({
            type: 'error',
            text: 'Could not send request. Check Firestore rules for codes and accessRequests.',
          });
        }
      };

      const handleApproveRequest = async (request) => {
        try {
          const userRef = doc(db, 'users', user.uid);
          const fresh = await getDoc(userRef);
          const data = fresh.data() || {};
          const collaborators = data.collaborators || [];
          const collaboratorUids = data.collaboratorUids || [];

          if (!collaboratorUids.includes(request.fromUid)) {
            await updateDoc(userRef, {
              collaborators: [
                ...collaborators,
                {
                  uid: request.fromUid,
                  role: request.role,
                  addedAt: new Date().toISOString(),
                  name: request.fromName || '',
                  email: request.fromEmail || '',
                },
              ],
              collaboratorUids: [...collaboratorUids, request.fromUid],
            });
          }

          await updateDoc(doc(db, 'accessRequests', request.id), { status: 'approved' });
        } catch (err) {
          console.error('Approve request error:', err);
          setErrorMessage('Failed to approve request.');
        }
      };

      const handleDenyRequest = async (request) => {
        try {
          await updateDoc(doc(db, 'accessRequests', request.id), { status: 'denied' });
        } catch (err) {
          console.error('Deny request error:', err);
          setErrorMessage('Failed to deny request.');
        }

      const handleRemoveCollaborator = async (professionalUid) => {

        try {

          const fresh = await getDoc(userRef);
          const data = fresh.data() || {};
          await updateDoc(userRef, {
            collaborators: (data.collaborators || []).filter((c) => c.uid !== professionalUid),
            collaboratorUids: (data.collaboratorUids || []).filter((id) => id !== professionalUid),

          const reqRef = doc(db, 'accessRequests', requestDocId(professionalUid, user.uid));
          const reqSnap = await getDoc(reqRef);
          if (reqSnap.exists()) {
            await updateDoc(reqRef, { status: 'removed' });

        } catch (err) {
          console.error('Remove collaborator error:', err);
          setErrorMessage('Failed to remove access.');

                    <span className="hidden sm:inline">New Goal</span>

                {/* User Avatar + Sign Out */}

                      alt={user.displayName || 'User'}

                    />

                    <div className="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-700">
                      {user.email ? user.email.charAt(0).toUpperCase() : 'U'}
                    </div>

                  <button
                    onClick={handleSignOut}
                    title="Sign Out"
                    className="text-xs font-semibold text-slate-500 hover:text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-lg transition cursor-pointer"
                  >
                    Sign Out
                  </button>
                </div>
              </div>
            </div>
          </header>

          {!isOwner && workspaceProfile && (
            <div className="bg-slate-900 text-white px-4 py-2.5 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <span>
                Viewing <span className="font-semibold">{workspaceProfile.displayName || workspaceProfile.email || 'client'}</span>
                ’s goals as <span className="font-semibold">{professionalRole || 'Professional'}</span>
                . Full view; you can only edit sub-categories tagged with your role.
              </span>
              <button
                type="button"
                onClick={() => handleSwitchWorkspace(user.uid)}
                className="self-start sm:self-auto bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg font-semibold cursor-pointer"
              >
                Back to my account
              </button>
            </div>
          )}

          {/* MAIN CONTAINER */}
          <main className="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
            {dataLoading && activeTab !== 'connect' ? (
              <div className="text-center py-20">
                <div className="w-8 h-8 border-2 border-emerald-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <span className="text-xs font-semibold text-slate-400">Loading your goals from cloud...</span>
              </div>
            ) : (
              <>
                {/* =========================================================
                    VIEW 1: ALL GOALS DASHBOARD
                   ========================================================= */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6 animate-in">

                    <div className="bg-white border border-slate-200/90 rounded-2xl p-6 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-6">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md">
                          Cloud Synced Roadmap
                        </span>
                        <h1 className="text-2xl font-bold text-slate-900 mt-2">Transform Vision Into Milestones</h1>
                        <p className="text-slate-500 text-sm mt-0.5 max-w-xl">
                          Signed in as <span className="font-semibold text-slate-700">{user.displayName || user.email}</span>. Your roadmaps are backed up securely.
                        </p>
                      </div>

                      <div className="flex items-center gap-6 border-t md:border-t-0 pt-4 md:pt-0 border-slate-100">
                        <div>
                          <div className="text-2xl font-extrabold text-slate-900">{goals.length}</div>
                          <div className="text-xs text-slate-400 font-medium">Active Goals</div>
                        </div>
                        <div className="w-px h-10 bg-slate-200" />
                        <div>
                          <div className="text-2xl font-extrabold text-emerald-600">

                          </div>
                          <div className="text-xs text-slate-400 font-medium">Tasks Done Today</div>
                        </div>
                        <div className="w-px h-10 bg-slate-200" />
                        <div>
                          <div className="text-2xl font-extrabold text-slate-800">{overallProgress}%</div>
                          <div className="text-xs text-slate-400 font-medium">Milestone Average</div>
                        </div>
                      </div>
                    </div>

                    {/* Filter and Search Bar */}
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                      <div className="relative w-full sm:w-72">
                        <input
                          type="text"
                          placeholder="Search goals or descriptions..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full text-xs bg-white border border-slate-200 rounded-xl pl-8 pr-3 py-2 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
                        />
                        <span className="absolute left-2.5 top-2.5 text-slate-400 text-xs">🔍</span>
                      </div>

                      <div className="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 custom-scrollbar">
                        <span className="text-xs text-slate-400 font-medium flex-shrink-0">Category:</span>
                        {categories.map((cat) => (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`text-xs px-3 py-1 rounded-full font-medium capitalize whitespace-nowrap transition ${
                              selectedCategory === cat
                                ? 'bg-slate-900 text-white'
                                : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                            }`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Goals Grid */}
                    {filteredGoals.length === 0 ? (
                      <div className="text-center bg-white border border-slate-200 rounded-2xl p-12">
                        <div className="text-4xl mb-2">🎯</div>
                        <h3 className="text-base font-semibold text-slate-800">No matching goals found</h3>
                        <p className="text-slate-400 text-sm max-w-sm mx-auto mt-1 mb-5">
                          {searchQuery
                            ? 'Try clearing your search query or create a new goal.'
                            : isOwner
                            ? 'Create your first goal to begin breaking down your roadmap.'
                            : 'This client has no goals yet.'}
                        </p>
                        {isOwner && (
                          <button
                            onClick={() => setIsModalOpen(true)}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-4 py-2 rounded-xl cursor-pointer"
                          >
                            + Create New Goal
                          </button>
                        )}
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {filteredGoals.map((goal) => {
                          const totalM = goal.milestones ? goal.milestones.length : 0;
                          const doneM = goal.milestones ? goal.milestones.filter((m) => m.completed).length : 0;
                          const pct = totalM > 0 ? Math.round((doneM / totalM) * 100) : 0;
                          const curKey = getCurrentMonthKey();
                          const curMilestone =
                            (goal.milestones && goal.milestones.find((m) => m.monthKey === curKey)) ||
                            (goal.milestones && goal.milestones.find((m) => !m.completed)) ||
                            (goal.milestones && goal.milestones[goal.milestones.length - 1]);

                          const goalTodayTasks = (goal.tasks || []).filter((t) => t.date === todayDate);
                          const doneTodayTasks = goalTodayTasks.filter((t) => t.completed).length;

                          No tasks scheduled for today across your goals.
                        </div>
                      ) : (
                        [...allTodayTasks]
                          .sort((a, b) => Number(a.completed) - Number(b.completed))

                              key={task.id}
                              className={`flex items-center justify-between p-3.5 rounded-xl border transition ${

                            >
                              <label className={`flex items-start gap-3 flex-1 min-w-0 pr-3 ${canEditTaskRecord(task.goalId, task) ? 'cursor-pointer' : 'cursor-default'}`}>
                                <input
                                  type="checkbox"
                                  checked={task.completed}
                                  disabled={!canEditTaskRecord(task.goalId, task)}
                                  onChange={() => handleToggleTask(task.goalId, task.id)}
                                  className="w-4 h-4 mt-0.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 disabled:opacity-40"
                                />
                                <div className="flex flex-col min-w-0">
                                  <span
                                    className={`text-sm ${
                                      task.completed ? 'line-through text-slate-400' : 'font-medium'
                                    }`}
                                  >
                                    {task.text}
                                  </span>
                                  <div className="flex items-center gap-2 mt-1">
                                    <span className="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.2 rounded">
                                      {task.goalTitle}
                                      {task.subcategoryName ? ` · ${task.subcategoryName}` : ''}
                                    </span>
                                    <PriorityBadge priority={task.priority} />
                                  </div>
                                </div>
                              </label>
                              {canEditTaskRecord(task.goalId, task) && (
                                <button
                                  onClick={() => handleDeleteTask(task.goalId, task.id)}
                                  className="text-slate-300 hover:text-rose-500 p-1 text-xs transition"
                                  title="Delete task"
                                >
                                  ✕
                                </button>
                              )}
                            </div>
                          ))
                      )}
                    </div>
                  </div>

                {/* =========================================================
                    VIEW 3: GOAL DETAIL (DAILY TASKS + MONTHLY MILESTONES)
                   ========================================================= */}
                {activeTab === 'detail' && currentGoal && (
                  <div className="space-y-6 animate-in">
                    {/* Top Goal Bar */}
                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
                      <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">

                        <div className="flex items-center gap-2 self-start">

                            >
                              Delete Goal
                            </button>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* 2-Column Responsive Layout */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                      {/* LEFT: Daily Task Execution */}
                      <div className="lg:col-span-6 space-y-6">
                        <DailyTaskSection
                          goal={currentGoal}
                          isOwner={isOwner}
                          professionalRole={professionalRole}
                          canEditSubcategoryTasks={canEditSubcategoryTasks}

    function CollaboratorsPanel({

          setTimeout(() => setCopied(false), 1500);

      return (
        <div className="space-y-6 animate-in max-w-3xl">
          <div>

            <p className="text-sm text-slate-500 mt-1">

            <div className="flex items-center gap-3">
              <div className="font-mono text-2xl tracking-[0.3em] font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-xl px-5 py-3">
                {profile?.code || '••••••'}
              </div>
              <button

                onClick={copyCode}
                disabled={!profile?.code}
                className="text-xs font-semibold px-3 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 cursor-pointer"
              >
                {copied ? 'Copied' : 'Copy'}
              </button>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
            <h2 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Connect as Professional</h2>
            <p className="text-xs text-slate-400 mt-1 mb-4">Enter a client’s code and the role you are requesting.</p>
            <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-2">
              <input
                type="text"
                maxLength={6}
                placeholder="ABC123"
                value={codeInput}
                onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
                className="sm:w-36 font-mono tracking-widest text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
              />
              <select
                value={role}
                onChange={(e) => setRole(e.target.value)}
                className="text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600"
              >
                {PROFESSIONAL_ROLES.map((r) => (
                  <option key={r} value={r}>{r}</option>
                ))}
              </select>
              <button
                type="submit"
                className="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-xl cursor-pointer"
              >
                Request access
              </button>
            </form>
            {connectNotice && (
              <p className={`text-xs mt-3 ${connectNotice.type === 'ok' ? 'text-emerald-700' : 'text-rose-600'}`}>
                {connectNotice.text}

            {pendingOut.length > 0 && (
              <div className="mt-4 pt-4 border-t border-slate-100">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Your pending requests</p>
                <ul className="space-y-1.5 text-sm text-slate-600">
                  {pendingOut.map((r) => (
                    <li key={r.id}>

                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
            <h2 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Pending requests</h2>
            <p className="text-xs text-slate-400 mt-1 mb-4">Professionals waiting for your approval.</p>
            {incomingError && (
              <p className="text-xs text-rose-600 mb-3">
                Could not load incoming requests: {incomingError}
              </p>
            )}
            {pendingIn.length === 0 ? (
              <p className="text-sm text-slate-400">No pending requests.</p>
            ) : (
              <ul className="space-y-3">
                {pendingIn.map((r) => (

                      <div className="text-sm font-semibold text-slate-900">{r.fromName || r.fromEmail || 'Professional'}</div>
                      <div className="text-xs text-slate-500">Requesting access as {r.role}</div>
                    </div>
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => onApprove(r)}
                        className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 cursor-pointer"
                      >
                        Approve
                      </button>
                      <button
                        type="button"
                        onClick={() => onDeny(r)}
                        className="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer"
                      >
                        Deny
                      </button>

                ))}
              </ul>
            )}

          <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
            <h2 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Connected professionals</h2>
            <p className="text-xs text-slate-400 mt-1 mb-4">People who can view your goals. They edit only sub-categories tagged with their role.</p>

              <p className="text-sm text-slate-400">None yet.</p>
            ) : (
              <ul className="space-y-3">
                {collaborators.map((c) => (
                  <li key={c.uid} className="flex items-center justify-between gap-3 border border-slate-200 rounded-xl p-3.5">
                    <div>
                      <div className="text-sm font-semibold text-slate-900">{c.name || c.email || c.uid}</div>
                      <div className="text-xs text-slate-500">{c.role}</div>
                    </div>
                    <button
                      type="button"
                      onClick={() => onRemove(c.uid)}
                      className="text-xs font-semibold text-rose-600 hover:bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg cursor-pointer"
                    >
                      Remove access
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
            <h2 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Clients I support</h2>
            <p className="text-xs text-slate-400 mt-1 mb-4">Accounts that approved you as a professional.</p>
            {clientList.length === 0 ? (
              <p className="text-sm text-slate-400">You are not connected to any clients yet.</p>
            ) : (
              <ul className="space-y-3">
                {clientList.map((c) => {
